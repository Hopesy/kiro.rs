name: Build and Push Docker Images

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for Docker images (e.g., 2025.12.1)'
        required: true
        default: '2026.3.6'

permissions:
  contents: read
  packages: write

jobs:
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        with:
          fetch-depth: 0

      - name: Check if commit has release tag
        id: check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/heads/* ]] && git tag --points-at HEAD | grep -q '^v'; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping beta build: commit already has a release tag"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: pre-check
    if: needs.pre-check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            INCLUDE_VERSION_TAG="true"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            INCLUDE_VERSION_TAG="true"
          else
            VERSION=""
            INCLUDE_VERSION_TAG="false"
          fi

          OWNER_LOWER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LOWER}/kiro-rs"
          {
            echo "tags<<EOF"
            if [ "$INCLUDE_VERSION_TAG" = "true" ]; then
              echo "$IMAGE:$VERSION"
            fi
            echo "$IMAGE:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$VERSION" ]; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Kiro.rs Docker Image
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Delete beta package versions
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: kiro-rs
        shell: bash
        run: |
          gh api "/users/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100" --jq '.[] | @base64' |
          while IFS= read -r encoded_version; do
            version="$(printf '%s' "$encoded_version" | base64 -d)"
            version_id="$(jq -r '.id' <<< "$version")"
            tags="$(jq -r '.metadata.container.tags[]?' <<< "$version")"

            if [ -z "$tags" ]; then
              continue
            fi

            has_beta_tag="false"
            has_protected_tag="false"
            while IFS= read -r tag; do
              case "$tag" in
                beta|beta-*) has_beta_tag="true" ;;
                latest|v*) has_protected_tag="true" ;;
              esac
            done <<< "$tags"

            if [ "$has_beta_tag" = "true" ] && [ "$has_protected_tag" = "false" ]; then
              gh api --method DELETE "/users/${OWNER}/packages/container/${PACKAGE}/versions/${version_id}"
              echo "Deleted beta package version ${version_id}"
            fi
          done

      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        shell: bash
        run: |
          curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK_URL"
